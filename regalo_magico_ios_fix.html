<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para ti ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta Korean Chic */
            --bg-color: #fffdf5;
            --card-bg: #ffffff;
            --text-dark: #635d51;
            --text-light: #9e9689;
            --btn-yes-bg: #ffe45e;
            --btn-yes-hover: #ffd900;
            --btn-no-bg: #f2efe9;
            --btn-no-text: #a8a093;
            
            /* Colores de las flores */
            --tulip-center: linear-gradient(to top, #f5a623 0%, #ffcc00 60%, #ffe600 100%);
            --tulip-side: linear-gradient(to top, #e68a00 0%, #ffb800 50%, #ffd000 100%);
            --tulip-shadow: inset -5px -10px 15px rgba(230, 138, 0, 0.4);
            
            /* Colores de tallo y hojas */
            --stem-grad: linear-gradient(to right, #4a6f3b, #648a52, #4a6f3b);
            --leaf-color: #5a8048;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, #fff7cc 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, #fff7cc 0%, transparent 40%);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #intro-card {
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(212, 185, 23, 0.08), 0 10px 20px rgba(0, 0, 0, 0.02);
            text-align: center;
            max-width: 90%;
            width: 400px;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            border: 2px solid #fffdf7;
        }

        #intro-card.hidden {
            opacity: 0;
            transform: translateY(-40px) scale(0.9);
            pointer-events: none;
        }

        .icon-top {
            font-size: 2.5rem;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 15px;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        p {
            font-size: 1rem;
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 55px;
        }

        button {
            border: none;
            padding: 15px 30px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 30px;
            /* FIX CRÍTICO PARA IOS: */
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            /* ------------------- */
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1001;
        }

        #btn-yes {
            background: var(--btn-yes-bg);
            color: #7a6100;
            box-shadow: 0 8px 20px rgba(255, 228, 94, 0.5);
            flex-grow: 1;
        }

        #btn-yes:hover, #btn-yes:active {
            background: var(--btn-yes-hover);
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 217, 0, 0.6);
        }

        #btn-no {
            background: var(--btn-no-bg);
            color: var(--btn-no-text);
            transition: top 0.3s ease, left 0.3s ease, transform 0.2s;
            z-index: 1002; 
        }

        #final-message {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            color: #d4a017;
            font-weight: 700;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 2s ease, transform 2s ease;
            z-index: 10;
            text-shadow: 0 4px 15px rgba(255, 217, 0, 0.3);
            pointer-events: none;
        }

        #final-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        #particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            bottom: -50px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,240,150,1) 0%, rgba(255,220,50,0.5) 50%, transparent 100%);
            opacity: 0;
            animation: floatUp ease-in infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        #bouquet-container {
            position: absolute;
            bottom: -80px; 
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
            display: flex;
            justify-content: center;
        }

        .tulip-wrapper {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            transform: rotate(var(--rot));
        }

        .stem {
            width: 12px;
            height: 0;
            background: var(--stem-grad);
            border-radius: 6px 6px 0 0;
            position: relative;
            margin: 0 auto;
            animation: growStem 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: var(--delay);
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
        }

        @keyframes growStem {
            0% { height: 0; }
            100% { height: var(--h); }
        }

        .flower-group {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            opacity: 0;
            animation: bloomFlower 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
            animation-delay: calc(var(--delay) + 1.2s);
            z-index: 10;
        }

        @keyframes bloomFlower {
            0% { transform: translateX(-50%) scale(0); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        .tulip-head {
            position: relative;
            width: 55px;
            height: 75px;
        }

        .petal-center {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--tulip-center);
            border-radius: 45% 45% 40% 40% / 60% 60% 40% 40%;
            box-shadow: inset 0 -5px 15px rgba(200, 100, 0, 0.3);
            z-index: 2;
        }

        .petal-left, .petal-right {
            position: absolute;
            bottom: 2%;
            width: 75%;
            height: 90%;
            background: var(--tulip-side);
            border-radius: 45% 45% 35% 35% / 60% 60% 40% 40%;
            box-shadow: var(--tulip-shadow);
            z-index: 3;
        }

        .petal-left {
            left: -12%;
            transform-origin: bottom right;
            transform: rotate(-15deg);
        }

        .petal-right {
            right: -12%;
            transform-origin: bottom left;
            transform: rotate(15deg);
        }

        .petal-back {
            position: absolute;
            top: -5px;
            left: 15%;
            width: 70%;
            height: 100%;
            background: #ffdb4d;
            border-radius: 50%;
            z-index: 1;
        }

        .leaf {
            position: absolute;
            background: var(--leaf-color);
            box-shadow: inset -3px 0 10px rgba(0,0,0,0.15);
            opacity: 0;
            transform: scale(0);
            animation: growLeaf 1.5s ease-out forwards;
            animation-delay: calc(var(--delay) + 0.6s);
            z-index: 1;
        }

        @keyframes growLeaf {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .leaf-left {
            width: 45px;
            height: 220px;
            border-radius: 100% 0% 100% 0%;
            bottom: 30px;
            left: -35px;
            transform-origin: bottom right;
        }

        .leaf-right {
            width: 45px;
            height: 190px;
            border-radius: 0% 100% 0% 100%;
            bottom: 60px;
            right: -35px;
            transform-origin: bottom left;
        }
        
        .tie {
            position: absolute;
            bottom: 80px; 
            width: 45px;
            height: 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            z-index: 100;
            opacity: 0;
            transform: translateX(-50%);
            left: 50%;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: opacity 2s ease 3s;
        }

        .tie.show {
            opacity: 1;
        }

    </style>
</head>
<body>

    <div id="particles-container"></div>
    
    <div id="final-message">Para iluminar tu día ✨</div>

    <div id="intro-card">
        <div class="icon-top">🎁</div>
        <h1>Un regalo para ti</h1>
        <p>Un pequeño detalle que te mereces, simplemente por ser tú. Hay algo hermoso esperando...</p>
        
        <div class="buttons-container">
            <button id="btn-yes">Sí, lo quiero</button>
            <button id="btn-no">No lo quiero</button>
        </div>
    </div>

    <!-- Contenedor del Ramo -->
    <div id="bouquet-container">
        <div class="tie" id="bouquet-tie"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnYes = document.getElementById('btn-yes');
            const btnNo = document.getElementById('btn-no');
            const card = document.getElementById('intro-card');
            const container = document.getElementById('bouquet-container');
            const tie = document.getElementById('bouquet-tie');
            const finalMessage = document.getElementById('final-message');
            const particlesContainer = document.getElementById('particles-container');

            let hasStarted = false; // Flag para evitar doble ejecución en iOS

            const escapeButton = (e) => {
                if (e && e.cancelable) {
                    e.preventDefault(); // Previene el clic accidental en dispositivos táctiles
                }
                
                if (btnNo.style.position !== 'fixed') {
                    btnNo.style.position = 'fixed';
                }

                const margin = 20;
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                
                const btnWidth = btnNo.offsetWidth;
                const btnHeight = btnNo.offsetHeight;

                // Evitar que se salga de la pantalla
                const newLeft = Math.random() * (windowWidth - btnWidth - margin * 2) + margin;
                const newTop = Math.random() * (windowHeight - btnHeight - margin * 2) + margin;

                btnNo.style.left = `${newLeft}px`;
                btnNo.style.top = `${newTop}px`;
            };

            // Eventos robustos para que el botón "No" huya
            btnNo.addEventListener('mouseover', escapeButton);
            btnNo.addEventListener('touchstart', escapeButton, { passive: false });
            btnNo.addEventListener('click', escapeButton);

            const bouquetConfig = [
                // Flores traseras (más altas, más inclinación)
                { rot: -22, h: 480, z: 1, leaf: 'left' },
                { rot: -14, h: 510, z: 2, leaf: 'right' },
                { rot: -6,  h: 530, z: 3, leaf: 'none' },
                { rot: 6,   h: 530, z: 3, leaf: 'left' },
                { rot: 14,  h: 510, z: 2, leaf: 'right' },
                { rot: 22,  h: 480, z: 1, leaf: 'left' },
                
                // Flores intermedias
                { rot: -18, h: 440, z: 4, leaf: 'left' },
                { rot: -9,  h: 460, z: 5, leaf: 'right' },
                { rot: 0,   h: 490, z: 6, leaf: 'left' },
                { rot: 9,   h: 460, z: 5, leaf: 'left' },
                { rot: 18,  h: 440, z: 4, leaf: 'right' },

                // Flores frontales (más bajas, llenando el centro)
                { rot: -5,  h: 400, z: 7, leaf: 'right' },
                { rot: 5,   h: 410, z: 8, leaf: 'left' }
            ];

            const createParticles = () => {
                for (let i = 0; i < 40; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    
                    particle.style.left = `${Math.random() * 100}vw`;
                    
                    const size = Math.random() * 15 + 10;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    
                    const duration = Math.random() * 4 + 4; 
                    const delay = Math.random() * 3; 
                    
                    particle.style.animationDuration = `${duration}s`;
                    particle.style.animationDelay = `${delay}s`;
                    
                    particlesContainer.appendChild(particle);
                }
            };

            const startMagic = (e) => {
                if (e && e.cancelable) {
                    e.preventDefault();
                }
                
                if (hasStarted) return; // Evita que se dispare dos veces en iOS (por touch + click)
                hasStarted = true;

                // Desaparecer tarjeta
                card.classList.add('hidden');
                
                // Mostrar el lazo decorativo al final
                tie.classList.add('show');

                let html = '';

                // Construimos los elementos del ramo dinámicamente
                bouquetConfig.forEach((t) => {
                    const baseDelay = 0.3;
                    const delay = baseDelay + (Math.abs(t.rot) / 25) * 1.5 + (Math.random() * 0.2);
                    
                    let leavesHTML = '';
                    if(t.leaf === 'left') leavesHTML = `<div class="leaf leaf-left"></div>`;
                    if(t.leaf === 'right') leavesHTML = `<div class="leaf leaf-right"></div>`;

                    html += `
                        <div class="tulip-wrapper" style="--rot: ${t.rot}deg; z-index: ${t.z};">
                            <div class="stem" style="--h: ${t.h}px; --delay: ${delay}s;">
                                ${leavesHTML}
                                <div class="flower-group" style="--delay: ${delay}s; bottom: ${t.h}px;">
                                    <div class="tulip-head">
                                        <div class="petal-back"></div>
                                        <div class="petal-center"></div>
                                        <div class="petal-left"></div>
                                        <div class="petal-right"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                // Inyectamos las flores tras una breve pausa
                setTimeout(() => {
                    container.innerHTML = `<div class="tie" id="bouquet-tie"></div>` + html;
                    
                    // Iniciar partículas
                    createParticles();

                    setTimeout(() => {
                        document.getElementById('bouquet-tie').classList.add('show');
                    }, 100);

                    // Mostrar mensaje final
                    setTimeout(() => {
                        finalMessage.classList.add('show');
                    }, 4500);

                }, 400); 
            };

            // FIX iOS: Asignar tanto 'click' como 'touchend'
            btnYes.addEventListener('click', startMagic);
            btnYes.addEventListener('touchend', startMagic, { passive: false });
        });
    </script>
</body>
</html>
